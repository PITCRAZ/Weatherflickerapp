<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Info</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    padding-top: 60px;
  }

  .hotel-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    padding: 20px 30px;
    width: 300px;
    text-align: center;
  }

  .hotel-card h2 {
    margin: 0 0 10px;
    font-size: 1.3em;
  }

  .hotel-card a {
    color: #0066cc;
    text-decoration: none;
    font-weight: bold;
  }

  .hotel-card a:hover {
    text-decoration: underline;
  }

  .coords {
    margin-top: 12px;
    font-size: 0.9em;
    color: #555;
  }
</style>
</head>
<body>

<div class="hotel-card">
  <h2>Prasi Sunset Bungalows - Bungalow with Ocean View</h2>
  <a href="https://example.com/hotel-page" target="_blank">View Hotel Page</a>
  <div class="coords">
    <p>Latitude: 39.9612</p>
    <p>Longitude: -82.9988</p>
  </div>
</div>

</body>
</html>
